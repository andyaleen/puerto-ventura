# Technical Director: reviews a PR via OpenAI and posts a handoff comment.
# Kickoff: comment exactly `technical-director-review` on a pull request
# (or workflow_dispatch with pr_number for debugging).
name: technical-director
run-name: Technical Director review for #${{ github.event.issue.number || inputs.pr_number }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  review-pr:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request &&
        github.event.comment.body == 'technical-director-review'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review pull request with Technical Director
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY secret is missing or empty."
            exit 1
          fi

          if [ -z "${PR_NUMBER}" ]; then
            echo "PR number is missing."
            exit 1
          fi

          echo "Fetching PR #$PR_NUMBER metadata"
          gh pr view "$PR_NUMBER" \
            --repo "$REPO" \
            --json number,title,body,state,isDraft,headRefName,baseRefName,author,closingIssuesReferences,url \
            > pr_meta.json

          echo "Fetching PR #$PR_NUMBER diff"
          gh pr diff "$PR_NUMBER" --repo "$REPO" > pr.diff || true

          # Bound diff size for the model context window.
          if [ "$(wc -c < pr.diff)" -gt 120000 ]; then
            head -c 120000 pr.diff > pr.diff.trimmed
            printf '\n\n[diff truncated for Technical Director context]\n' >> pr.diff.trimmed
            mv pr.diff.trimmed pr.diff
          fi

          mkdir -p linked_issues
          : > linked_issues.md
          ISSUE_NUMBERS="$(jq -r '.closingIssuesReferences[].number // empty' pr_meta.json)"
          if [ -n "$ISSUE_NUMBERS" ]; then
            while IFS= read -r ISSUE_NUMBER; do
              [ -z "$ISSUE_NUMBER" ] && continue
              echo "Fetching linked issue #$ISSUE_NUMBER"
              gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json number,title,body,url \
                > "linked_issues/${ISSUE_NUMBER}.json"
              {
                echo "## Issue #${ISSUE_NUMBER}"
                jq -r '"Title: " + .title + "\nURL: " + .url + "\n\n" + (.body // "")' \
                  "linked_issues/${ISSUE_NUMBER}.json"
                echo
                echo "---"
                echo
              } >> linked_issues.md
            done <<< "$ISSUE_NUMBERS"
          else
            echo "No closing issues linked." > linked_issues.md
          fi

          collect_doc() {
            local path="$1"
            if [ -f "$path" ]; then
              echo
              echo "===== FILE: ${path} ====="
              echo
              # Bound each doc for prompt size.
              head -c 20000 "$path"
              echo
            fi
          }

          {
            collect_doc "AGENTS.md"
            collect_doc "docs/architecture.md"
            collect_doc "docs/roadmap.md"
            collect_doc "docs/coding_rules.md"
            collect_doc "docs/automation.md"
            collect_doc "docs/development/backlog.md"
            collect_doc "docs/development/milestones.md"
            collect_doc "docs/development/current_sprint.md"
            collect_doc "docs/development/architecture_decisions.md"
            collect_doc "docs/design/vision.md"
            collect_doc "docs/design/gameplay.md"
            collect_doc "docs/design/progression.md"
          } > project_docs.md

          jq -n \
            --rawfile meta pr_meta.json \
            --rawfile diff pr.diff \
            --rawfile issues linked_issues.md \
            --rawfile docs project_docs.md \
            '{
              role: "Technical Director for Puerto Ventura",
              instructions: (
                "Review this pull request against the linked issues, AGENTS.md expectations, " +
                "and project docs. Decide whether to approve or request changes. " +
                "Do not create GitHub issues. Do not apply an agent label. Do not post agent go. " +
                "Reply with ONLY valid JSON matching the schema. No markdown fences."
              ),
              response_schema: {
                review_status: "approve|request_changes",
                summary: "string",
                requirements_met: ["string"],
                problems: ["string"],
                required_changes: ["string"],
                next_action: "merge|revise"
              },
              pull_request: ($meta | fromjson),
              pull_request_diff: $diff,
              linked_issues: $issues,
              project_documentation: $docs
            }' > prompt_payload.json

          PROMPT="$(jq -r '
            "You are the Technical Director for the Puerto Ventura game.\n\n" +
            .instructions + "\n\n" +
            "Required JSON schema:\n" +
            (.response_schema | tostring) + "\n\n" +
            "Pull request metadata (JSON):\n" +
            (.pull_request | tostring) + "\n\n" +
            "Linked issues:\n" +
            .linked_issues + "\n\n" +
            "Project documentation excerpts:\n" +
            .project_documentation + "\n\n" +
            "Pull request diff:\n" +
            .pull_request_diff
          ' prompt_payload.json)"

          REQUEST_BODY="$(jq -n --arg model "gpt-5" --arg input "$PROMPT" \
            '{model: $model, store: false, input: $input}')"

          HTTP_CODE="$(curl --silent --show-error \
            --output response.json \
            --write-out '%{http_code}' \
            https://api.openai.com/v1/responses \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "OpenAI Responses API failed (HTTP ${HTTP_CODE}):"
            cat response.json
            exit 1
          fi

          MODEL_TEXT="$(jq -r '
            (
              [.output[]? | select(.type == "message") | .content[]? | select(.type == "output_text") | .text]
              | map(select(. != null and . != ""))
              | first
            )
            // .output[0].content[0].text
            // empty
          ' response.json)"

          if [ -z "$MODEL_TEXT" ] || [ "$MODEL_TEXT" = "null" ]; then
            echo "OpenAI response did not include output text:"
            cat response.json
            exit 1
          fi

          echo "Raw model response:"
          echo "$MODEL_TEXT"

          # Strip optional markdown fences, then validate JSON.
          CLEAN_TEXT="$(printf '%s' "$MODEL_TEXT" | sed -e 's/^```json[[:space:]]*//' -e 's/^```[[:space:]]*//' -e 's/```[[:space:]]*$//')"
          printf '%s' "$CLEAN_TEXT" > review.json
          if ! jq -e '
            .review_status and (.review_status == "approve" or .review_status == "request_changes") and
            (.summary | type == "string") and
            (.requirements_met | type == "array") and
            (.problems | type == "array") and
            (.required_changes | type == "array") and
            (.next_action == "merge" or .next_action == "revise")
          ' review.json >/dev/null; then
            echo "Model response was not valid review JSON:"
            cat review.json
            exit 1
          fi

          REVIEW_COMMENT="$(jq -r '
            "## Technical Director Review\n\n" +
            "**Status:** " + .review_status + "\n\n" +
            "**Next action:** " + .next_action + "\n\n" +
            "### Summary\n\n" + .summary + "\n\n" +
            "### Requirements met\n\n" +
            (if (.requirements_met | length) == 0 then "- (none)\n"
             else ([.requirements_met[] | "- " + .] | join("\n") + "\n") end) +
            "\n### Problems\n\n" +
            (if (.problems | length) == 0 then "- (none)\n"
             else ([.problems[] | "- " + .] | join("\n") + "\n") end) +
            "\n### Required changes\n\n" +
            (if (.required_changes | length) == 0 then "- (none)\n"
             else ([.required_changes[] | "- " + .] | join("\n") + "\n") end)
          ' review.json)"

          printf '%s\n' "$REVIEW_COMMENT" > review_comment.md
          echo "Posting review comment on PR #$PR_NUMBER"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file review_comment.md
