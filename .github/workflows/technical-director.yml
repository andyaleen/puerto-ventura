# Notifies the technical director (ChatGPT) that Cursor finished a ticket.
# Posts a ready marker on each issue this PR will close when merged.
name: technical-director

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  notify-linked-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on closing issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"

          RESPONSE="$(gh api graphql -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 50) {
                    nodes { number }
                  }
                }
              }
            }
          ' -f owner="$OWNER" -f name="$NAME" -F number="$PR_NUMBER")"

          ISSUE_NUMBERS="$(printf '%s' "$RESPONSE" | jq -r '
            .data.repository.pullRequest.closingIssuesReferences.nodes[].number
          ')"

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "No closing issues linked to PR #$PR_NUMBER; exiting successfully."
            exit 0
          fi

          COMMENT="$(printf 'technical-director-ready\n\nPR: #%s\nBranch: %s\nURL: %s\n' \
            "$PR_NUMBER" "$PR_BRANCH" "$PR_URL")"

          while IFS= read -r ISSUE_NUMBER; do
            [ -z "$ISSUE_NUMBER" ] && continue
            echo "Posting technical-director-ready on issue #$ISSUE_NUMBER"
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "$COMMENT"
          done <<< "$ISSUE_NUMBERS"

      - name: Call Technical Director (OpenAI)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY secret is missing or empty."
            exit 1
          fi

          PROMPT=$(cat <<'EOF'
You are the Technical Director for the Puerto Ventura game.

A pull request has been opened.

Reply with ONLY valid JSON:

{
  "status":"received",
  "next_action":"review_pr"
}
EOF
          )

          REQUEST_BODY="$(jq -n --arg model "gpt-5" --arg input "$PROMPT" \
            '{model: $model, store: false, input: $input}')"

          HTTP_CODE="$(curl --silent --show-error \
            --output response.json \
            --write-out '%{http_code}' \
            https://api.openai.com/v1/responses \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "OpenAI Responses API failed (HTTP ${HTTP_CODE}):"
            cat response.json
            exit 1
          fi

          MODEL_TEXT="$(jq -r '
            (
              [.output[]? | select(.type == "message") | .content[]? | select(.type == "output_text") | .text]
              | map(select(. != null and . != ""))
              | first
            )
            // .output[0].content[0].text
            // empty
          ' response.json)"

          if [ -z "$MODEL_TEXT" ] || [ "$MODEL_TEXT" = "null" ]; then
            echo "OpenAI response did not include output text:"
            cat response.json
            exit 1
          fi

          echo "$MODEL_TEXT"
